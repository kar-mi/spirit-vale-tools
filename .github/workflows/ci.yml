name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Check dependency deduplication
        run: bun dedupe --check
      - name: Typecheck Bun package
        run: bun run typecheck
      - name: Test Bun package
        run: bun test
      - name: Build reusable packages
        run: bun run build
